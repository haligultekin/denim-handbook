site_name: "Denim Handbook"
site_description: "The Open-Source Knowledge Base & Maker Blueprint for Raw Denim, Shuttle Looms, and Heritage Workwear."
site_author: "Ali Gultekin & Contributors"
site_url: "https://haligultekin.github.io/denim-handbook/"
repo_name: "haligultekin/denim-handbook"
repo_url: "https://github.com/haligultekin/denim-handbook"
edit_uri: "edit/main/"

docs_dir: "docs"
site_dir: "site"

theme:
  name: "material"
  language: "en"
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: "Switch to dark mode"
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: "Switch to light mode"
  font:
    text: "Inter"
    code: "JetBrains Mono"
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - "Overview": "README.md"
  - "1. History & Origins": "HISTORY.md"
  - "2. Fabric & Twill Weaves": "FABRIC.md"
  - "3. Thread & Seam Specs": "THREAD.md"
  - "4. Hardware & Fasteners": "HARDWARE.md"
  - "5. Machinery & Looms": "MACHINES.md"
  - "6. Pattern & Construction": "PATTERN.md"
  - "7. Care & Maintenance": "CARE.md"
  - "8. Technical Glossary": "GLOSSARY.md"
  - "9. Community & Literature": "COMMUNITY.md"
  - "10. Socioeconomics & Ethics": "SOCIOECONOMICS.md"
  - "Pattern Vector CAD Archive": "patterns/INDEX.md"
