<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" width="100%" height="100%" style="background:#fcfcfc; font-family:system-ui, -apple-system, sans-serif;">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e5e7eb" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1e3a8a"/>
    </marker>
    <marker id="red-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Title & Metadata -->
  <text x="40" y="40" font-size="20" font-weight="bold" fill="#0f172a">Denim Handbook · 1947 Classic Five-Pocket Pattern Block &amp; Selvedge Lay Plan</text>
  <text x="40" y="62" font-size="12" fill="#475569">Archetype: Definitive Mid-Century Straight Cut | 29"–30" Shuttle Loom Selvedge Denim Layout Schematic</text>
  <text x="40" y="80" font-size="11" fill="#2563eb">Key Engineering: Straight Selvedge Outseams · Flat-Felled Inseam &amp; Yoke · 1/2" Seam Allowance on Joining Edges</text>

  <!-- Fabric Bolt Boundary (30" Width Scale) -->
  <g transform="translate(40, 105)">
    <!-- Top Selvedge (Red ID Ticker) -->
    <line x1="0" y1="0" x2="920" y2="0" stroke="#b91c1c" stroke-width="3" stroke-dasharray="8,3"/>
    <text x="10" y="-8" font-size="11" font-weight="bold" fill="#b91c1c">▲ TOP SELVEDGE LINE (RAW WOVEN EDGE · ZERO TRIMMING) ▲</text>

    <!-- Bottom Selvedge (Red ID Ticker) -->
    <line x1="0" y1="460" x2="920" y2="460" stroke="#b91c1c" stroke-width="3" stroke-dasharray="8,3"/>
    <text x="10" y="478" font-size="11" font-weight="bold" fill="#b91c1c">▼ BOTTOM SELVEDGE LINE (RAW WOVEN EDGE · ZERO TRIMMING) ▼</text>
    
    <!-- Fabric Width Dimension -->
    <line x1="-15" y1="0" x2="-15" y2="460" stroke="#475569" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="-22" y="240" font-size="11" font-weight="bold" fill="#475569" transform="rotate(-90, -22, 240)" text-anchor="middle">FABRIC WIDTH: ~30 INCHES (76 CM)</text>

    <!-- 1. Front Leg Pattern Block (Lies right on bottom selvedge) -->
    <g id="front-leg">
      <!-- Outer boundary: Outseam is totally straight against bottom selvedge (y=460) from hem up to hip -->
      <path d="M 50 460 L 50 350 Q 80 348 100 355 L 120 380 Q 130 405 150 410 L 260 415 L 430 425 L 430 460 Z" 
            fill="#dbeafe" stroke="#1e3a8a" stroke-width="2" opacity="0.9"/>
      <text x="210" y="440" font-size="12" font-weight="bold" fill="#1e3a8a">FRONT LEG (CUT 2 PAIR)</text>
      <text x="65" y="385" font-size="10" fill="#1e293b">Pocket Scoop</text>
      <text x="125" y="400" font-size="9" fill="#1e293b">Fly Extension</text>
      <text x="260" y="430" font-size="9" fill="#64748b">Shaped Inseam (1/2" flat-fell)</text>
      <text x="435" y="445" font-size="9" fill="#475569" transform="rotate(90, 435, 445)">Hem (1" chainstitch)</text>
      
      <!-- Outseam Annotation -->
      <line x1="60" y1="452" x2="420" y2="452" stroke="#b91c1c" stroke-width="1" stroke-dasharray="4,2"/>
      <text x="240" y="456" font-size="9" fill="#b91c1c" text-anchor="middle">Straight Selvedge Outseam</text>
    </g>

    <!-- 2. Back Leg Pattern Block (Inverted layout for tight nesting on narrow selvedge) -->
    <g id="back-leg" transform="translate(900, 0) scale(-1, 1)">
      <!-- Back Leg Outseam placed against top selvedge (y=0) -->
      <path d="M 50 0 L 50 140 Q 80 155 130 160 L 175 120 Q 210 100 240 85 L 340 70 L 490 60 L 490 0 Z" 
            fill="#e0e7ff" stroke="#312e81" stroke-width="2" opacity="0.9"/>
      <text x="230" y="35" font-size="12" font-weight="bold" fill="#312e81" transform="scale(-1, 1) translate(-460, 0)">BACK LEG (CUT 2 PAIR)</text>
      <text x="150" y="115" font-size="9" fill="#312e81" transform="scale(-1, 1) translate(-300, 0)">Crotch Extension Curve</text>
      <text x="75" y="130" font-size="9" fill="#312e81" transform="scale(-1, 1) translate(-150, 0)">Angled Yoke Seam</text>
      <text x="320" y="55" font-size="9" fill="#64748b" transform="scale(-1, 1) translate(-640, 0)">Inseam (Felled)</text>
      
      <!-- Outseam Annotation -->
      <line x1="60" y1="8" x2="480" y2="8" stroke="#b91c1c" stroke-width="1" stroke-dasharray="4,2"/>
      <text x="270" y="18" font-size="9" fill="#b91c1c" text-anchor="middle" transform="scale(-1, 1) translate(-540, 0)">Straight Selvedge Outseam</text>
    </g>

    <!-- 3. Rear Yokes (Pair) -->
    <g id="rear-yokes" transform="translate(60, 10)">
      <path d="M 0 0 L 90 0 L 75 45 L 0 35 Z" fill="#eff6ff" stroke="#1e3a8a" stroke-width="1.8"/>
      <path d="M 95 0 L 185 0 L 170 45 L 95 35 Z" fill="#eff6ff" stroke="#1e3a8a" stroke-width="1.8"/>
      <text x="92" y="24" font-size="9" font-weight="bold" fill="#1e3a8a" text-anchor="middle">REAR YOKES (CUT 2)</text>
      <text x="92" y="36" font-size="8" fill="#64748b" text-anchor="middle">Flat-Felled to Back Leg</text>
    </g>

    <!-- 4. Back Patch Pockets (Pair) -->
    <g id="back-pockets" transform="translate(60, 75)">
      <!-- Left Pocket -->
      <path d="M 0 0 L 65 0 L 65 60 L 32.5 80 L 0 60 Z" fill="#eff6ff" stroke="#1e3a8a" stroke-width="1.8"/>
      <!-- Double Stitch & Arcuate Guide -->
      <path d="M 5 12 L 60 12" stroke="#f59e0b" stroke-width="1"/>
      <path d="M 5 40 Q 32.5 60 60 40" fill="none" stroke="#f59e0b" stroke-width="1" stroke-dasharray="2,2"/>
      <text x="32" y="30" font-size="8" font-weight="bold" fill="#1e3a8a" text-anchor="middle">BACK POCKET</text>
      <text x="32" y="70" font-size="7" fill="#64748b" text-anchor="middle">L (Cut 1)</text>

      <!-- Right Pocket -->
      <g transform="translate(80, 0)">
        <path d="M 0 0 L 65 0 L 65 60 L 32.5 80 L 0 60 Z" fill="#eff6ff" stroke="#1e3a8a" stroke-width="1.8"/>
        <path d="M 5 12 L 60 12" stroke="#f59e0b" stroke-width="1"/>
        <path d="M 5 40 Q 32.5 60 60 40" fill="none" stroke="#f59e0b" stroke-width="1" stroke-dasharray="2,2"/>
        <text x="32" y="30" font-size="8" font-weight="bold" fill="#1e3a8a" text-anchor="middle">BACK POCKET</text>
        <text x="32" y="70" font-size="7" fill="#64748b" text-anchor="middle">R (Cut 1)</text>
      </g>
    </g>

    <!-- 5. Coin / Watch Pocket & Fly Facings -->
    <g id="small-pieces" transform="translate(60, 185)">
      <!-- Coin Pocket (Cut along selvedge edge for self-finished hem) -->
      <rect x="0" y="0" width="45" height="50" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
      <line x1="0" y1="2" x2="45" y2="2" stroke="#b91c1c" stroke-width="2"/>
      <text x="22" y="22" font-size="7.5" font-weight="bold" fill="#b45309" text-anchor="middle">COIN POCKET</text>
      <text x="22" y="34" font-size="7" fill="#78350f" text-anchor="middle">Selvedge Hem</text>

      <!-- Fly Shield & Underlap -->
      <rect x="60" y="0" width="30" height="65" rx="3" fill="#eff6ff" stroke="#1e3a8a" stroke-width="1.5"/>
      <text x="75" y="32" font-size="7.5" font-weight="bold" fill="#1e3a8a" text-anchor="middle">FLY</text>
      <text x="75" y="44" font-size="6.5" fill="#64748b" text-anchor="middle">SHIELD</text>

      <!-- Belt Loops (Long Strip) -->
      <rect x="105" y="0" width="18" height="95" fill="#f1f5f9" stroke="#475569" stroke-width="1.2"/>
      <text x="114" y="50" font-size="7" font-weight="bold" fill="#475569" text-anchor="middle" transform="rotate(90, 114, 50)">BELT LOOP STRIP (CUT 5 PIECES)</text>
    </g>

    <!-- 6. One-Piece Continuous Waistband Strip (Spans along fabric grain) -->
    <g id="waistband" transform="translate(260, 200)">
      <rect x="0" y="0" width="320" height="36" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
      <line x1="0" y1="18" x2="320" y2="18" stroke="#86efac" stroke-width="1" stroke-dasharray="3,3"/>
      <text x="160" y="14" font-size="9" font-weight="bold" fill="#15803d" text-anchor="middle">CONTINUOUS WAISTBAND STRIP</text>
      <text x="160" y="28" font-size="8" fill="#166534" text-anchor="middle">Chainstitched Lower Edge · Fold Line in Center · Cut 1 on Grain</text>
    </g>

    <!-- 7. Pocket Bags (Pocketing Muslin / Twill - Explanatory Note) -->
    <g id="pocket-bags" transform="translate(260, 260)">
      <rect x="0" y="0" width="140" height="80" rx="4" fill="#fafaf9" stroke="#78716c" stroke-width="1.2" stroke-dasharray="4,2"/>
      <text x="70" y="32" font-size="9" font-weight="bold" fill="#44403c" text-anchor="middle">POCKET BAGS (×4)</text>
      <text x="70" y="48" font-size="8" fill="#78716c" text-anchor="middle">Cut on 5–6 oz Cotton Drill</text>
      <text x="70" y="62" font-size="7.5" fill="#a8a29e" text-anchor="middle">(Not cut from heavy denim)</text>
    </g>

    <!-- Grainline Vector Indicator -->
    <g transform="translate(450, 280)">
      <line x1="0" y1="0" x2="110" y2="0" stroke="#1e3a8a" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
      <text x="55" y="-6" font-size="9" font-weight="bold" fill="#1e3a8a" text-anchor="middle">WARP / SELVEDGE GRAIN DIRECTION</text>
    </g>
  </g>

  <!-- Construction Standards Box -->
  <g transform="translate(40, 600)">
    <rect width="920" height="95" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="20" y="24" font-size="12" font-weight="bold" fill="#0f172a">1947 BLUEPRINT DRAFTING SPECIFICATIONS:</text>
    
    <text x="20" y="44" font-size="10.5" fill="#334155">
      <tspan font-weight="bold" fill="#1e3a8a">• Straight Outseams:</tspan> Narrow 29"–30" selvedge denim enforces completely straight side seams from hip to hem, producing the legendary classic drape.
    </text>
    <text x="20" y="62" font-size="10.5" fill="#334155">
      <tspan font-weight="bold" fill="#1e3a8a">• Flat-Felled Inseams:</tspan> 1/2" lap allowance sewn with tandem needle gauge (typically 1/4" or 3/16"), pressing the fold cleanly towards the rear leg.
    </text>
    <text x="20" y="80" font-size="10.5" fill="#334155">
      <tspan font-weight="bold" fill="#1e3a8a">• Hidden Hardware Clearance:</tspan> Back patch pockets allow 3/4" fold-under at the top hem to house recessed concealed copper rivets at stress corners.
    </text>
  </g>
</svg>