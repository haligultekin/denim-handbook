<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%" style="background:#fcfcfc; font-family:system-ui, -apple-system, sans-serif;">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e5e7eb" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1e3a8a"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Title & Metadata -->
  <text x="40" y="45" font-size="20" font-weight="bold" fill="#0f172a">Denim Handbook · 1974 8-Panel Newsboy Cap Pattern Block</text>
  <text x="40" y="70" font-size="12" fill="#475569">Archetype: Zero-Waste Upcycling Blueprint from Yankee Denim Dandies (Fehr, 1974) | Scale 1:1 at 96 DPI</text>
  <text x="40" y="88" font-size="11" fill="#2563eb">Format: Vector SVG · Ready for Laser Cutting, Projection, or Paper Plotting (Cut on Solid Lines, 1/4" Seam Allowance Included)</text>

  <!-- Crown Panel (1 of 8) -->
  <g transform="translate(100, 120)">
    <path d="M 100 0 C 145 70, 160 160, 160 210 C 160 260, 145 350, 100 420 C 55 350, 40 260, 40 210 C 40 160, 55 70, 100 0 Z" 
          fill="#eff6ff" stroke="#1e3a8a" stroke-width="2.5" />
    <!-- Seam allowance guide (dashed) -->
    <path d="M 100 15 C 138 75, 150 160, 150 210 C 150 260, 138 345, 100 405 C 62 345, 50 260, 50 210 C 50 160, 62 75, 100 15 Z" 
          fill="none" stroke="#60a5fa" stroke-width="1.2" stroke-dasharray="4,4" />

    <!-- Center Grainline -->
    <line x1="100" y1="40" x2="100" y2="380" stroke="#1e3a8a" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="108" y="215" font-size="11" fill="#1e3a8a" font-weight="600" transform="rotate(90, 108, 215)">GRAINLINE / UP-CYCLE WARP AXIS</text>

    <!-- Labels -->
    <text x="100" y="160" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">CROWN PANEL</text>
    <text x="100" y="180" text-anchor="middle" font-size="12" fill="#475569">CUT 8 ON DENIM</text>
    <text x="100" y="250" text-anchor="middle" font-size="11" fill="#64748b">Width: 3.5" (89 mm)</text>
    <text x="100" y="270" text-anchor="middle" font-size="11" fill="#64748b">Height: 10.5" (267 mm)</text>
    <text x="100" y="310" text-anchor="middle" font-size="10" fill="#dc2626">★ Tip: Center an original</text>
    <text x="100" y="325" text-anchor="middle" font-size="10" fill="#dc2626">copper rivet or Red Tab here!</text>
  </g>

  <!-- Visor / Bill Crescent -->
  <g transform="translate(420, 140)">
    <path d="M 20 180 C 70 80, 250 80, 300 180 C 240 135, 80 135, 20 180 Z" 
          fill="#eff6ff" stroke="#1e3a8a" stroke-width="2.5" />
    <!-- Visor insert line -->
    <path d="M 35 170 C 80 95, 240 95, 285 170 C 235 142, 85 142, 35 170 Z" 
          fill="none" stroke="#60a5fa" stroke-width="1.2" stroke-dasharray="4,4" />

    <text x="160" y="130" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">CRESCENT VISOR / BILL</text>
    <text x="160" y="148" text-anchor="middle" font-size="11" fill="#475569">CUT 2 ON DENIM + 1 CARDBOARD INSERT</text>

    <!-- Horizontal Dimension -->
    <line x1="20" y1="195" x2="300" y2="195" stroke="#475569" stroke-width="1"/>
    <text x="160" y="210" text-anchor="middle" font-size="10" fill="#475569">Span: 7.0" (178 mm)</text>
  </g>

  <!-- Sweatband & Lining Guide -->
  <g transform="translate(420, 380)">
    <rect x="20" y="0" width="300" height="45" fill="#f8fafc" stroke="#475569" stroke-width="1.5" stroke-dasharray="2,2"/>
    <text x="170" y="22" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">INTERIOR SWEATBAND LINING STRIP</text>
    <text x="170" y="38" text-anchor="middle" font-size="10" fill="#64748b">Cut 1 on Cotton Twill/Satin · 4.0" (102 mm) wide × [Head Size + 2.0"]</text>
  </g>

  <!-- Legend & Specification Box -->
  <g transform="translate(40, 520)">
    <rect width="720" height="60" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="20" y="25" font-size="11" font-weight="bold" fill="#1e293b">CONSTRUCTION NOTES:</text>
    <text x="20" y="42" font-size="10" fill="#475569">1. Stitch eight shell panels with 1/4" seam allowance. 2. Press seams open. 3. Join visor crescents, turn right side out, insert cardboard stiffener, topstitch. 4. Attach visor to shell. 5. Install sweatband.</text>
  </g>
</svg>
